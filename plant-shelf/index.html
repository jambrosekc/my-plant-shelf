<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Plant Shelf</title>
<style>
:root{--glass:#e9f1ee;--pot:#d9a78a;--terra:#c2714f;--linen:#f6f1e7;--card:#fffdf8;--sage:#5f8a6a;--sage-d:#456b50;--sage-l:#dde8da;--wood:#c9a77c;--ink:#2c3a2f;--mut:#6f7d72;--line:#e3dccb;--warn:#b5651d;--bad:#b3402f;}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--linen);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--sage-d);color:#fff;position:sticky;top:0;z-index:5}
.hdr h1{font-size:18px}
.hdr small{opacity:.8;display:block;font-weight:400;font-size:12px}
.link{background:none;border:0;color:inherit;text-decoration:underline;padding:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;max-width:760px;margin:0 auto}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tab.on{background:var(--sage);border-color:var(--sage);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--sage);color:#fff;font-weight:600}
.btn.alt{background:var(--sage-l);color:var(--sage-d)}
.btn.bad{background:#f3d9d3;color:var(--bad)}
.btn[disabled]{opacity:.5}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:64px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d);font-weight:600}
.seller{margin:18px 0 4px;font-size:16px;color:var(--sage-d);display:flex;justify-content:space-between;border-bottom:2px solid var(--wood);padding-bottom:4px}
.stage{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.plant{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0;overflow:hidden}
.plant .top{display:flex;gap:8px;align-items:center;padding:10px}
.plant .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:var(--ink)}
.plant .nm b{display:block;font-weight:600}
.plant .nm small{color:var(--mut);font-size:12px}
.tog{display:flex;gap:5px}
.fgrp{display:flex;align-items:center;gap:8px}.flab{font-size:11px;text-transform:uppercase;color:var(--mut);min-width:50px}
.sec{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--sage-d)}
.rad{display:flex;gap:6px;align-items:center;margin:0;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card)}
.wsel{border:1px solid var(--line);border-radius:9px;padding:7px 6px;font-size:12px;background:#fff;max-width:128px}
.wsel.w-ship{background:#d9a441;color:#fff;border-color:#d9a441}.wsel.w-labeled{background:var(--sage);color:#fff;border-color:var(--sage)}.wsel.w-print{background:var(--sage-l);border-color:var(--sage)}.wsel.w-missing{background:#f6dcdc}
.tg{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:9px;padding:7px 9px;font-size:12px;min-width:54px}
.tg.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
.tg.ship.on{background:#d9a441;border-color:#d9a441;color:#fff}
.detail{border-top:1px solid var(--line);padding:6px 12px 12px;background:#fbf8f0}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shelf{margin:18px 0 6px}
.shelf h3{font-size:15px;color:var(--sage-d);margin-bottom:6px}
.board{display:flex;gap:8px;flex-wrap:wrap;padding:12px 10px 16px;border-bottom:10px solid var(--wood);border-radius:4px;background:linear-gradient(#fbf8f0,#f1e9d8)}
.pot{background:var(--card);border:1px solid var(--line);border-radius:10px 10px 22px 22px;padding:8px 12px;font-size:13px;max-width:170px;text-align:center}
.pot.off{opacity:.45}
.ishelf{margin:18px 0 6px}.ishelf h3{font-size:15px;color:var(--sage-d);margin-bottom:6px}
.irow{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px 6px;padding:10px 8px 6px;border-bottom:12px solid var(--wood);border-radius:4px;background:linear-gradient(#fbf8f0,#f1e9d8)}
.icell{text-align:center;font-size:12px;line-height:1.2}.icell svg{width:100%;height:auto;display:block}.icell b{display:block;font-weight:600}.icell em{display:block;font-style:normal;color:var(--mut);font-size:11px}.icell.off{opacity:.4}
.sheetwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:70vh}
.sheet{border-collapse:collapse;font-size:13px;min-width:900px}.sheet th{position:sticky;top:0;background:var(--sage-l);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:1}
.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}.sheet td input[type=text],.sheet td input[type=number],.sheet td select{width:100%;min-width:90px;border:0;background:transparent;padding:7px 8px}.sheet td.c{text-align:center}.sheet td.ro{padding:7px 8px;color:var(--mut);white-space:nowrap}
.sheet tr:nth-child(even) td{background:#faf6ec}
.pot em{display:block;font-style:normal;color:var(--mut);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%}
.mut{color:var(--mut)}
.card.good{border:2px solid var(--sage);box-shadow:0 0 0 5px rgba(95,138,106,.28)}
.msgbox{margin-top:14px;padding:10px 12px;border-radius:10px;background:#f3d9d3;color:var(--bad)}
.msgbox.ok{background:var(--sage-l);color:var(--sage-d)}
.err{color:var(--bad)}
.ok{color:var(--sage-d)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;color:var(--sage-d);margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script>
/* ---------- config ---------- */
var SUPABASE_URL='https://hfdrqhtwfmktyqdvfjyv.supabase.co';
var SUPABASE_KEY='sb_publishable_A99g8FcIytThC-bBf2lSeQ_4J5uNdAH';

/* ---------- column map: spreadsheet header -> database field ---------- */
var COLS=[
 ['Plant Name','plant_name','text',1],['Genus','genus','text'],['Species','species','text'],
 ['Cultivar/Base Form','cultivar','text'],['Variant/Variegation','variant','text'],['Plant ID','plant_id','text'],
 ['Seller Name','seller_name','text'],['Seller Sourced From','sourced_from','text'],['Purchase Date','purchase_date','date'],
 ['Purchase Price ($)','purchase_price','num'],['Order ID','order_id','text'],['Purchase Stage','purchase_stage','text'],
 ['Grown From','grown_from','text'],['Generation/Lineage','lineage','text'],
 ['Soil Likes','soil_likes','text'],['pH Level','ph','text'],['Light Level','light','text'],['Watering Needs','watering_needs','text'],
 ['Current Soil Medium','soil_medium','text'],['Current Temp (F)','temp','num'],['Current Humidity (%)','humidity','num'],
 ['Last Watered','last_watered','date'],['Water Every (days)','water_every_days','num'],
 ['Have It','have_it','bool'],['Have It Labeled','labeled','bool'],['Shipping','shipping','bool'],
 ['To Print','to_print','bool'],['To Repot','to_repot','bool'],['To Water','to_water','bool'],['Notes','notes','text'],
 ['For Sale','for_sale','bool'],['Asking Price ($)','asking_price','num'],['Sold','sold','bool'],['Sold Date','sold_date','date'],
 ['Sold Price ($)','sold_price','num'],['Sold To / Platform','sold_to','text'],['Sale Notes','sale_notes','text']
];
var ALIAS={'Current Temp (°F)':'Current Temp (F)','Inventory Note':'Notes'};
var STAGES=['TC','Plug','Starter','Established','Juvenile','Corm','Cutting','Tree'];

/* ---------- state ---------- */
var sb=null,user=null,shelfName='My Shelf',plants=[],tab='inv',filter='all',q='',pickOpen=false,markDone=false,open={},msg='',importState=null,authMode='in',recovery=false,needResend='',prof={ready:false,is_public:false,show_prices:false,public_slug:''},pubSlug=new URLSearchParams(location.search).get('shelf'),pub=null,pubErr='';

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var tt;function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2800)}

/* ---------- data layer ---------- */
async function loadPlants(){
  var r=await sb.from('plants').select('*').order('created_at',{ascending:true});
  if(r.error){toast('Could not load: '+r.error.message);return}
  plants=r.data||[];
}
async function loadProfile(){
  var r=await sb.from('profiles').select('shelf_name,is_public,show_prices,public_slug').eq('id',user.id).maybeSingle();
  if(r&&r.error){
    prof.ready=false;
    var r2=await sb.from('profiles').select('shelf_name').eq('id',user.id).maybeSingle();
    shelfName=(r2&&r2.data&&r2.data.shelf_name)||(user.user_metadata&&user.user_metadata.shelf_name)||'My Shelf';return;
  }
  var d=(r&&r.data)||{};
  shelfName=d.shelf_name||(user.user_metadata&&user.user_metadata.shelf_name)||'My Shelf';
  prof={ready:true,is_public:!!d.is_public,show_prices:!!d.show_prices,public_slug:d.public_slug||''};
}
async function saveProfile(patch){
  var before=Object.assign({},prof);Object.assign(prof,patch);render();
  var r=await sb.from('profiles').update(patch).eq('id',user.id);
  if(r.error){prof=before;render();toast('Could not save: '+r.error.message)}
}
function newSlug(){var a=new Uint8Array(6);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function shareLink(){return location.origin+location.pathname+'?shelf='+prof.public_slug}
async function loadPublic(){
  var r=await sb.rpc('get_public_shelf',{p_slug:pubSlug});
  if(r.error){pubErr='Could not load this shelf.';return}
  pub=r.data||null;
}
async function patchPlant(id,patch){
  var p=plants.find(function(x){return x.id===id});if(!p)return;
  var before={};Object.keys(patch).forEach(function(k){before[k]=p[k];p[k]=patch[k]});
  render();
  var r=await sb.from('plants').update(patch).eq('id',id);
  if(r.error){Object.keys(before).forEach(function(k){p[k]=before[k]});render();toast('Could not save: '+r.error.message)}
}
async function removePlant(id){
  var r=await sb.from('plants').delete().eq('id',id);
  if(r.error){toast('Could not delete: '+r.error.message);return}
  plants=plants.filter(function(x){return x.id!==id});render();
}
var BOOLS=['have_it','labeled','shipping','to_print','to_repot','to_water','for_sale','sold'];
async function addPlants(rows){
  rows=rows.map(function(r){var o=Object.assign({},r);BOOLS.forEach(function(k){if(o[k]!==true)o[k]=false});return o});
  var out=[];
  for(var i=0;i<rows.length;i+=200){
    var chunk=rows.slice(i,i+200);
    var r=await sb.from('plants').insert(chunk).select();
    if(r.error)return {error:r.error,done:out.length};
    out=out.concat(r.data||[]);
  }
  await loadPlants();return {done:out.length};
}

/* ---------- helpers ---------- */
var WHERE=[['ship','Shipping'],['received','Received'],['print','Needs label printed'],['labeled','Labeled'],['missing',"Can't find it"]];
function whereOf(p){
  if(p.shipping)return 'ship';
  if(!p.have_it)return 'missing';
  if(p.labeled)return 'labeled';
  if(p.to_print)return 'print';
  return 'received';
}
function wherePatch(w){
  return {shipping:w==='ship',have_it:w==='received'||w==='print'||w==='labeled',labeled:w==='labeled',to_print:w==='print'};
}
function sellOf(p){return p.sold?'sold':p.for_sale?'sale':'none'}
function sellPatch(w){return {for_sale:w==='sale',sold:w==='sold'}}
function linkPatch(p,k){var o={};o[k]=!p[k];return o}
function haveish(p){return p.have_it||p.shipping}
function labelNums(){
  var cnt={},tot={},m={};
  plants.forEach(function(p){var k=(p.plant_name||'').toLowerCase();tot[k]=(tot[k]||0)+1});
  plants.forEach(function(p){var k=(p.plant_name||'').toLowerCase();cnt[k]=(cnt[k]||0)+1;m[p.id]=cnt[k]+' of '+tot[k]});
  return m;
}
function passes(p){
  if(q){var s=(p.plant_name+' '+(p.seller_name||'')+' '+(p.plant_id||'')+' '+(p.genus||'')).toLowerCase();if(s.indexOf(q.toLowerCase())<0)return false}
  switch(filter){
    case 'labeled':return whereOf(p)==='labeled';
    case 'missing':return whereOf(p)==='missing';
    case 'received':return whereOf(p)==='received';
    case 'shipping':return p.shipping;
    case 'print':return whereOf(p)==='print';
    case 'repot':return p.to_repot;
    case 'water':return p.to_water;
    case 'sale':return p.for_sale&&!p.sold;
    case 'sold':return p.sold;
  }
  return true;
}
function stageRank(s){var i=STAGES.indexOf(s);return i<0?99:i}

/* ---------- plant drawing (from the illustrated shelf) ---------- */
function genKey(p){return (p.genus&&p.genus!=='None')?p.genus:'Unknown'}
var gid=0;
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
var LEAF={
 Alocasia:'M0,-4 C-12,2 -17,-20 -5,-40 L0,-60 L5,-40 C17,-20 12,2 0,-4Z',
 Philodendron:'M0,-4 C-20,6 -24,-22 -10,-38 C-6,-44 -2,-50 0,-58 C2,-50 6,-44 10,-38 C24,-22 20,6 0,-4Z',
 Anthurium:'M0,-4 C-26,8 -28,-24 -9,-38 C-5,-42 -2,-46 0,-52 C2,-46 5,-42 9,-38 C28,-24 26,8 0,-4Z',
 Monstera:'M0,-4 C-24,0 -26,-34 -8,-46 C-3,-50 3,-50 8,-46 C26,-34 24,0 0,-4Z',
 Begonia:'M0,-4 C-22,4 -24,-26 -6,-42 C4,-50 20,-40 20,-20 C20,-6 10,-2 0,-4Z',
 gen:'M0,-4 C-16,-2 -18,-30 0,-54 C18,-30 16,-2 0,-4Z'
};
var LC={Alocasia:'#5f8260',Philodendron:'#7c9a62',Anthurium:'#3e6150',Monstera:'#6b9468',Begonia:'#8a9a62',Syngonium:'#9cb878',Pothos:'#9ab86a',Rhaphidophora:'#7fa070',Ficus:'#4b6648',Ceropegia:'#7fa57a',Caladium:'#b87a80'};
function leafCol(p){var t=(p.plant_name||'').toLowerCase();if(/velvet|dark phoenix|ace of spades|warocq/.test(t))return '#2f4a3a';if(/lime|neon|aurea/.test(t))return '#a9c06a';return LC[genKey(p)]||'#5f7d4a'}
var TRAIL={Pothos:1,Ceropegia:1};
function varColor(p){
  var t=(p.plant_name||'').toLowerCase();
  if(/pink/.test(t))return '#e6b8bd'; if(/aurea|gold/.test(t))return '#d5cf8a'; if(/mint/.test(t))return '#bfe0cc';
  if(/albo|variegat|marble|snow|tricolor|splash|ghost|galaxy|\bvar\b/.test(t))return '#f3f1e4'; return null;
}
function plantSVG(p){
  var g=genKey(p),path=LEAF[g]||LEAF.gen,h=hash(p.plant_id||p.plant_name||''),n=3+h%3,vc=varColor(p),
      semi=/semi|leca|hydro/i.test(p.soil_medium||'')||p.purchase_stage==='TC',out='',defs='',stems='',leaves='';
  var id='g'+(++gid),lc=leafCol(p),velvet=lc==='#2f4a3a';
  if(vc)defs='<linearGradient id="'+id+'" x1="0" x2="1" y1="0" y2="0"><stop offset=".5" stop-color="'+lc+'"/><stop offset=".5" stop-color="'+vc+'"/></linearGradient>';
  for(var i=0;i<n;i++){
    var a=(-48+96*i/(n-1))+((h>>(i*3))%13-6), L=22+((h>>i)%9), sc=.75+(((h>>(i+2))%5)/14),
        x=50+Math.sin(a*Math.PI/180)*L, y=84-Math.cos(a*Math.PI/180)*L;
    stems+='<line x1="50" y1="86" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1.1"/>';
    var fill=(vc&&i%2===0)?'url(#'+id+')':lc;
    leaves+='<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+a.toFixed(0)+') scale('+sc.toFixed(2)+')"><path d="'+path+'" fill="'+fill+'" stroke="var(--ink)" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/><path d="M0,-4 L0,-46 M0,-18 L-9,-28 M0,-18 L9,-28 M0,-30 L-7,-38 M0,-30 L7,-38" stroke="#f6ead0" stroke-opacity="'+(velvet?'.85':'.5')+'" stroke-width="1.3" fill="none" stroke-linecap="round"/></g>';
  }
  var pot;
  if(semi){
    var balls='';for(var r=0;r<5;r++)for(var c=0;c<5;c++){balls+='<circle cx="'+(31+c*9.5+(r%2)*4)+'" cy="'+(94+r*8)+'" r="4.4" fill="#c6b49a" stroke="#2f3b33" stroke-opacity=".5" stroke-width=".8"/>'}
    pot='<clipPath id="c'+id+'"><path d="M26 86 H74 V118 Q74 126 66 126 H34 Q26 126 26 118Z"/></clipPath><g clip-path="url(#c'+id+')">'+balls+'<path d="M34 112 q6 6 4 12 M60 100 q-6 8 -2 16" stroke="#f4efe0" stroke-width=".8" fill="none"/></g>'+
        '<path d="M26 86 H74 V118 Q74 126 66 126 H34 Q26 126 26 118Z" fill="var(--glass)" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/><path d="M32 90 V118" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>';
  }else{var ps=h%3,pc=ps===0?'var(--pot)':(ps===1?'#f1eee2':'#a9b79f');
    pot='<path d="M26 88 H74 L69 126 H31Z" fill="'+pc+'" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/><rect x="24" y="84" width="52" height="8" rx="3" fill="'+pc+'" stroke="var(--ink)" stroke-width="1.3"/>'+(ps===1?'<path d="M28 104 H72" stroke="var(--terra)" stroke-width="2.5"/>':'')+(ps===2?'<path d="M32 98 q18 8 36 0" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1" fill="none"/>':'');}
  if(TRAIL[g]){var tr='';[[30,-1],[70,1]].forEach(function(s){var x0=s[0],d=s[1];tr+='<path d="M'+x0+' 90 C'+(x0+d*14)+' 100 '+(x0-d*6)+' 112 '+(x0+d*8)+' 126" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1.1"/>';[[x0+d*9,102],[x0-d*1,112],[x0+d*7,122]].forEach(function(q){tr+='<ellipse cx="'+q[0]+'" cy="'+q[1]+'" rx="6" ry="4.4" fill="'+lc+'" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1" transform="rotate('+(d*30)+' '+q[0]+' '+q[1]+')"/>'})});pot+=tr}
  return '<svg viewBox="-12 0 124 130" role="img" aria-label="'+esc(p.plant_name)+'"><defs>'+defs+'</defs>'+stems+leaves+pot+'</svg>';
}

function illusShelf(list,opts){
  opts=opts||{};var g={};list.forEach(function(p){var k=p.genus||'Other';(g[k]=g[k]||[]).push(p)});
  var h='';
  Object.keys(g).sort().forEach(function(k){
    h+='<div class="ishelf"><h3>'+esc(k)+' <span class="mut">('+g[k].length+')</span></h3><div class="irow">'+g[k].map(function(p){
      var have=p.have_it||p.shipping,sub=opts.sub?opts.sub(p):(p.seller_name||'');
      return '<div class="icell'+(have?'':' off')+'">'+plantSVG(p)+'<b>'+esc(p.plant_name)+'</b><em>'+esc(sub)+'</em></div>'}).join('')+'</div></div>';
  });
  return h;
}
/* ---------- views ---------- */
function render(){
  var app=$('#app');
  if(pubSlug){app.innerHTML=publicView();return}
  if(recovery){app.innerHTML=recoveryView();return}

/* ---------- import ---------- */
function toBool(v){return /^(y|yes|true|1|x)$/i.test(String(v==null?'':v).trim())}
function pad(n){return (n<10?'0':'')+n}
function toDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[1])+'-'+pad(+m[2])}
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function toNum(v){
  if(v==null||v==='')return null;
  var n=parseFloat(String(v).replace(/[$,%\s]|°F/g,''));return isNaN(n)?null:n;
}
function parseSheet(buf){
  var wb=XLSX.read(buf,{type:'array',cellDates:true});
  var name=wb.SheetNames.indexOf('Plants')>=0?'Plants':wb.SheetNames[0];
  var data=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true});
  if(!data.length)return {error:'That file is empty.'};
  var head=data[0].map(function(h){h=String(h).trim();return ALIAS[h]||h});
  var byName={};COLS.forEach(function(c){byName[c[0]]=c});
  if(head.indexOf('Plant Name')<0)return {error:'The column "Plant Name" was not found in row 1. Download the template and keep its column names exactly.'};
  var ignored=head.filter(function(h){return h&&!byName[h]});
  var rows=[],skipped=0;
  for(var i=1;i<data.length;i++){
    var r=data[i],o={};
    head.forEach(function(h,ci){
      var c=byName[h];if(!c)return;var v=r[ci];if(v===''||v==null)return;
      o[c[1]]=c[2]==='bool'?toBool(v):c[2]==='num'?toNum(v):c[2]==='date'?toDate(v):String(v).trim();
    });
    if(!o.plant_name){skipped++;continue}
    if(o.notes&&/^example row/i.test(o.notes)){skipped++;continue}
    rows.push(o);
  }
  if(!rows.length)return {error:'No plants found. Is the Plant Name column filled in?'};
  return {rows:rows,ignored:ignored.filter(function(v,i,a){return a.indexOf(v)===i}),skipped:skipped};
}
function downloadTemplate(){
  var heads=COLS.map(function(c){return c[0]});
  var ex=COLS.map(function(c){return c[0]==='Plant Name'?'Alocasia Example':c[0]==='Have It'?'Yes':c[0]==='Notes'?'Example row. Delete it before importing':''});
  var ws=XLSX.utils.aoa_to_sheet([heads,ex]);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Plants');
  XLSX.writeFile(wb,'plant_import_template.xlsx');
}

 {plant_name:'Monstera Thai Constellation',genus:'Monstera',seller_name:'Other Seller',purchase_stage:'Plug',shipping:true},
 {plant_name:'Begonia Maculata',genus:'Begonia',seller_name:'Sample Seller',purchase_stage:'Established'},
 {plant_name:'Alocasia Polly',genus:'Alocasia',seller_name:'Other Seller',purchase_stage:'TC',have_it:true,to_repot:true}
];

/* ---------- events ---------- */
document.addEventListener('click',async function(e){
  var t=e.target.closest('th[data-sort],[data-tab],[data-f],[data-t],[data-s],[data-open],[data-del],[data-a]');if(!t)return;
  if(t.dataset.sort){if(sheetSort===t.dataset.sort)sheetDir=-sheetDir;else{sheetSort=t.dataset.sort;sheetDir=1}render();return}
  if(t.dataset.s){patchPlant(t.dataset.id,sellPatch(t.dataset.s));return}
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.f){filter=t.dataset.f;render();return}
  if(t.dataset.open){open[t.dataset.open]=!open[t.dataset.open];render();return}
  if(t.dataset.t){var p=plants.find(function(x){return x.id===t.dataset.id});if(!p)return;patchPlant(p.id,linkPatch(p,t.dataset.t));return}
  if(t.dataset.del){if(confirm('Delete this plant?'))removePlant(t.dataset.del);return}
  var a=t.dataset.a;
  if(a==='mode'){authMode=authMode==='in'?'up':'in';msg='';needResend='';render();return}
  if(a==='mode-in'){authMode='in';msg='';render();return}
  if(a==='forgot'){authMode='reset';msg='';needResend='';render();return}
  if(a==='resend'){var rr=await sb.auth.resend({type:'signup',email:needResend});msg=rr.error?rr.error.message:'Sent. Check your email for a new confirmation link.';render();return}
  if(a==='out'){await sb.auth.signOut();user=null;plants=[];render();return}
  if(a==='tpl'){downloadTemplate();return}
  if(a==='pickcols'){pickOpen=!pickOpen;render();return}
  if(a==='dlprint'){downloadPrint();return}
  if(a==='copylink'){try{await navigator.clipboard.writeText(shareLink());toast('Link copied')}catch(x){var el=$('#plink');if(el){el.select();toast('Press and hold to copy')}}return}
  if(a==='newlink'){if(confirm('The old link will stop working. Continue?'))saveProfile({public_slug:newSlug()});return}
  if(a==='sample'){var r=await addPlants(SAMPLES);if(r.error)toast('Could not add: '+r.error.message);else{toast('Added '+r.done+' sample plants');render()}return}
  if(a==='cancelimp'){importState=null;render();return}
  if(a==='doimp'){
    importState.busy=true;render();
    var res=await addPlants(importState.rows);
    if(res.error){importState.busy=false;toast('Import stopped: '+res.error.message+' ('+res.done+' saved)');render();return}
    toast('Imported '+res.done+' plants');importState=null;tab='inv';render();
  }
});
document.addEventListener('submit',async function(e){
  e.preventDefault();
  if(e.target.id==='authf'){
    msg='';var em=$('#em').value.trim(),pw=$('#pw').value;
    var r;
    if(authMode==='up')r=await sb.auth.signUp({email:em,password:pw,options:{data:{shelf_name:($('#shn').value||'').trim()||'My Shelf'}}});
    else r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){
      var m=r.error.message||'Something went wrong';
      needResend='';
      if(/not confirmed/i.test(m)){msg='That email is not confirmed yet. Check your inbox (and spam) for the confirmation link, or send a new one.';needResend=em}
      else if(/invalid login/i.test(m))msg='That email or password is not right. If you forgot your password, use Forgot password below.';
      else msg=m;
      render();return}
    if(!r.data.session){msg='Account created! Check your email to confirm your account, then come back here and sign in.';authMode='in';needResend=em;render();return}
    await boot(r.data.session);
  }
  if(e.target.id==='resetf'){
    var rem=$('#em').value.trim();
    var rr2=await sb.auth.resetPasswordForEmail(rem,{redirectTo:location.origin+location.pathname});
    msg=rr2.error?rr2.error.message:'Check your email for a link to reset your password.';render();return}
  if(e.target.id==='recf'){
    var ur=await sb.auth.updateUser({password:$('#npw').value});
    if(ur.error){msg=ur.error.message;render();return}
    recovery=false;msg='Password updated.';
    var gs=await sb.auth.getSession();await boot(gs.data&&gs.data.session);toast('Password updated');return}
  if(e.target.id==='addf'){
    var w=(document.querySelector('input[name=where]:checked')||{}).value||'received',sl=(document.querySelector('input[name=sell]:checked')||{}).value||'none';
    var row=Object.assign({plant_name:$('#a_name').value.trim(),genus:$('#a_genus').value.trim()||null,purchase_stage:$('#a_stage').value||null,seller_name:$('#a_seller').value.trim()||null,sourced_from:$('#a_src').value.trim()||null,purchase_date:$('#a_date').value||null,purchase_price:toNum($('#a_price').value),soil_medium:$('#a_soil').value.trim()||null,last_watered:$('#a_water').value||null,to_repot:$('#a_repot').checked,to_water:$('#a_towater').checked,asking_price:sl==='sale'?toNum($('#a_ask').value):null,notes:$('#a_notes').value.trim()||null},wherePatch(w),sellPatch(sl));
    var res=await addPlants([row]);
    if(res.error)toast('Could not add: '+res.error.message);else{toast('Added '+row.plant_name);tab='inv';render()}
  }
});
document.addEventListener('input',function(e){if(e.target.id==='search'){q=e.target.value;render()}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='sell'){$('#a_askwrap').hidden=t.value!=='sale';return}
  if(t.dataset&&t.dataset.sell){patchPlant(t.dataset.sell,sellPatch(t.value));return}
  if(t.dataset&&t.dataset.t&&t.type==='checkbox'){var pp2=plants.find(function(x){return x.id===t.dataset.id});if(pp2)patchPlant(pp2.id,linkPatch(pp2,t.dataset.t));return}
  if(t.dataset&&t.dataset.w){patchPlant(t.dataset.w,wherePatch(t.value));return}
  if(t.id==='markdone'){markDone=t.checked;return}
  if(t.dataset&&t.dataset.pc){var cur=pickedCols().map(function(c){return c[0]}),ix=cur.indexOf(t.dataset.pc);if(t.checked&&ix<0)cur.push(t.dataset.pc);if(!t.checked&&ix>=0)cur.splice(ix,1);cur=PCOLS.map(function(c){return c[0]}).filter(function(n){return cur.indexOf(n)>=0});try{localStorage.setItem('printCols',JSON.stringify(cur))}catch(x){}return}
  if(t.dataset&&t.dataset.p){var pp={};pp[t.dataset.p]=t.checked;saveProfile(pp);return}
  if(t.dataset&&t.dataset.e){var v=t.value.trim(),k=t.dataset.e;var patch={};patch[k]=(k==='purchase_price'||k==='asking_price')?toNum(v):(v||null);patchPlant(t.dataset.id,patch);return}
  if(t.id==='file'&&t.files[0]){
    var f=t.files[0],rd=new FileReader();
    rd.onload=function(){try{importState=parseSheet(new Uint8Array(rd.result))}catch(x){importState={error:'Could not read that file: '+x.message}}render()};
    rd.readAsArrayBuffer(f);
  }
});

/* ---------- boot ---------- */
async function boot(session){
  user=session&&session.user||null;
  if(user){await loadProfile();await loadPlants()}
  render();
}
(async function(){
  sb=window.__sb||supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  if(pubSlug){await loadPublic();render();return}
  sb.auth.onAuthStateChange(function(ev,session){if(ev==='PASSWORD_RECOVERY'){recovery=true;render()}if(ev==='SIGNED_OUT'){user=null;plants=[];render()}});
  var r=await sb.auth.getSession();
  await boot(r.data&&r.data.session);
})();
</script>
