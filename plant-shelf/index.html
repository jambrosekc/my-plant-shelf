<title>Plant Shelf v4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: linen wall, pale ash shelves drawn with hairlines, botanical line-art plants standing on the boards, small paper tags hung below. Palette: moss, sage, lichen, stone. */
:root{
  --paper:#ecebe2; --card:#f7f6f0; --card2:#e5e6d9; --ink:#2f3b33; --muted:#697466; --line:rgba(47,59,51,.55);
  --terra:#4f6b57; --olive:#9fb19a; --mustard:#cfd0aa; --blush:#e3dccf; --sage:#cdd8c6; --sand:#e3e1d2;
  --leaf:#6a8a62; --pot:#cdbfa8; --wood:#d6c8aa; --wood-hi:#e6dbc2; --glow:rgba(255,252,228,.7); --glass:rgba(255,255,255,.5);
  --accent:#4f6b57; --accent-ink:#f7f6f0;
  --display:'Cormorant Garamond','Georgia',serif; --body:'DM Sans','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1e2520; --card:#29322b; --card2:#323c34; --ink:#e6eadf; --muted:#a3ae9f; --line:rgba(230,234,223,.45);
  --terra:#8fb59a; --olive:#6f8a74; --mustard:#8f9570; --blush:#3a3f37; --sage:#3a4a3e; --sand:#343d36;
  --leaf:#7fa062; --pot:#7a7160; --wood:#6f6a55; --wood-hi:#858066; --glow:rgba(200,230,200,.07); --glass:rgba(255,255,255,.14);
  --accent:#8fb59a; --accent-ink:#14211a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1e2520; --card:#29322b; --card2:#323c34; --ink:#e6eadf; --muted:#a3ae9f; --line:rgba(230,234,223,.45);
  --terra:#8fb59a; --olive:#6f8a74; --mustard:#8f9570; --blush:#3a3f37; --sage:#3a4a3e; --sand:#343d36;
  --leaf:#7fa062; --pot:#7a7160; --wood:#6f6a55; --wood-hi:#858066; --glow:rgba(200,230,200,.07); --glass:rgba(255,255,255,.14);
  --accent:#8fb59a; --accent-ink:#14211a; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse 90% 55% at 100% 0,var(--glow),transparent 70%),radial-gradient(ellipse 60% 40% at 0 100%,var(--glow),transparent 75%);
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
.lights{display:block;width:100%;height:44px;margin:-6px 0 2px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:clamp(44px,9vw,68px);font-weight:500;font-style:italic;color:var(--terra);letter-spacing:-.01em}
.top .squig{display:none}
.top p{margin:6px 0 0;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 18px;font-weight:500}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:var(--accent-ink)}
.btn.small{padding:5px 13px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 200px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 15px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--terra);color:var(--accent-ink)}
select.sort{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 8px;min-height:34px}
.crumbs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 13px;font-weight:500}
.crumbs button[aria-current=page]{background:var(--sage);color:var(--ink)}
.crumbs span{color:var(--muted)}
.rank{font-family:var(--display);font-size:21px;font-style:italic;color:var(--muted);margin:0 0 14px}
.board{padding:0 2px}
.shelf{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin:0 0 56px;padding:0 8px}
.cell{display:flex;align-items:flex-end;justify-content:center;min-width:0;padding-top:16px}
.item{position:relative;border:0;background:transparent;padding:0 3px;width:100%;max-width:190px;display:block;transition:transform .2s}
.item:hover{transform:translateY(-4px)}
.item svg{width:100%;height:auto;display:block;margin-bottom:-2px}
.plank{grid-column:1/-1;height:14px;position:relative;background:linear-gradient(var(--wood-hi),var(--wood));border:1px solid var(--line);border-radius:2px}
.br{position:absolute;top:100%;width:18px;height:22px;border-left:1px solid var(--line);
  background:linear-gradient(to bottom right,transparent calc(50% - .6px),var(--line) calc(50% - .6px),var(--line) calc(50% + .6px),transparent calc(50% + .6px))}
.br.l{left:9%}.br.r{right:9%;transform:scaleX(-1)}
.tag{padding:26px 4px 0;text-align:center;min-width:0}
.lab{display:inline-block;max-width:100%;position:relative;background:var(--card);border:1px solid var(--line);border-radius:3px 3px 8px 8px;padding:4px 10px 6px}
.lab::before{content:"";position:absolute;left:50%;top:-18px;height:18px;border-left:1px solid var(--line)}
.lab b{display:block;font-family:var(--display);font-size:18px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.lab i{display:block;font-style:normal;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.count{position:absolute;top:22%;right:2%;background:var(--card);color:var(--ink);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px;border-radius:999px;min-width:32px;height:28px;display:grid;place-items:center;padding:0 8px;z-index:2}
.pic{position:absolute;right:-4%;bottom:6px;width:46%;aspect-ratio:1;border:1px solid var(--line);background:#fff;padding:3px 3px 12px;box-sizing:border-box;object-fit:cover;z-index:3;transform:rotate(5deg);box-shadow:0 3px 8px rgba(30,40,30,.18)}
.cell.decor{pointer-events:none}.cell.decor svg{width:58%;height:auto;display:block;margin-bottom:-2px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.veil{position:fixed;inset:0;background:rgba(25,32,27,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.sheet{background:var(--card);width:100%;max-width:640px;border:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:30px max(20px,env(safe-area-inset-left,0px)) calc(26px + env(safe-area-inset-bottom,0px));margin-top:max(24px,env(safe-area-inset-top,0px));position:relative}
@media(min-width:700px){.veil{align-items:center;padding:24px}.sheet{border-radius:18px;margin:auto}}
.x{position:absolute;top:10px;right:12px;border:1px solid var(--line);background:transparent;width:32px;height:32px;border-radius:50%;font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:20px;align-items:end;margin-bottom:14px}
@media(max-width:460px){.hero{grid-template-columns:1fr}.hero .art2{max-width:200px;margin:0 auto}}
.art2{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:14px 14px 0;position:relative;overflow:hidden;padding-bottom:14px}
.art2 svg{width:100%;display:block;position:relative;z-index:1}
.art2 img{width:100%;border-radius:6px;display:block;aspect-ratio:1;object-fit:cover}
.sh{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(var(--wood-hi),var(--wood));border-top:1px solid var(--line)}
.hero h2{font-size:34px;font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 11px;font-size:13px}
.chip.v{background:var(--terra);border-color:var(--terra);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.cond{background:var(--card2);border-radius:10px;padding:9px 13px;min-width:0}
.cond small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;font-weight:700}
.cond strong{display:block;font-family:var(--display);font-size:23px;font-weight:600;overflow-wrap:anywhere;line-height:1.15}
.cond strong.none{font-size:14px;font-family:var(--body);color:var(--muted);font-weight:400}
.meta{color:var(--muted);font-size:14px;margin:4px 0}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0;border:1px dashed var(--line);border-radius:12px;padding:14px}
.qr .box{background:#fff;padding:8px;border-radius:6px;line-height:0;border:1px solid var(--line)}
.qr p{margin:0 0 6px;font-size:13px;color:var(--muted);flex:1 1 170px;min-width:0;overflow-wrap:anywhere}
pre.json{background:var(--card2);border-radius:10px;padding:12px;overflow:auto;max-height:260px;font-size:12px;line-height:1.4;margin:10px 0 0}
form fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}
form legend{font-family:var(--display);font-size:25px;font-weight:600;font-style:italic;margin-bottom:8px;padding:0;color:var(--terra)}
.f{display:grid;gap:4px;margin-bottom:10px;min-width:0}
.f label{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.f input[type=range]{padding:0;accent-color:var(--terra)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.hint{font-size:12px;color:var(--muted)}
.found{background:var(--sage);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;margin:-2px 0 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;z-index:40;font-weight:500}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <header class="top">

  <div class="tools">

    <div class="seg" role="group" aria-label="View">
      <button type="button" id="vGroups" aria-pressed="true">By group</button>
      <button type="button" id="vAll" aria-pressed="false">Every plant</button>
    </div>
    <select class="sort" id="sort" aria-label="Sort"><option value="name">Sort: name</option><option value="count">Sort: most first</option><option value="new">Sort: newest</option></select>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <p class="rank" id="rank"></p>
  <main id="shelves" class="board"></main>
</div>

    pot='<clipPath id="c'+id+'"><path d="M26 86 H74 V118 Q74 126 66 126 H34 Q26 126 26 118Z"/></clipPath><g clip-path="url(#c'+id+')">'+balls+'<path d="M34 112 q6 6 4 12 M60 100 q-6 8 -2 16" stroke="#f4efe0" stroke-width=".8" fill="none"/></g>'+
        '<path d="M26 86 H74 V118 Q74 126 66 126 H34 Q26 126 26 118Z" fill="var(--glass)" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/><path d="M32 90 V118" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>';
  }else{var ps=h%3,pc=ps===0?'var(--pot)':(ps===1?'#f1eee2':'#a9b79f');
    pot='<path d="M26 88 H74 L69 126 H31Z" fill="'+pc+'" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/><rect x="24" y="84" width="52" height="8" rx="3" fill="'+pc+'" stroke="var(--ink)" stroke-width="1.3"/>'+(ps===1?'<path d="M28 104 H72" stroke="var(--terra)" stroke-width="2.5"/>':'')+(ps===2?'<path d="M32 98 q18 8 36 0" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1" fill="none"/>':'');}
  if(TRAIL[g]){var tr='';[[30,-1],[70,1]].forEach(function(s){var x0=s[0],d=s[1];tr+='<path d="M'+x0+' 90 C'+(x0+d*14)+' 100 '+(x0-d*6)+' 112 '+(x0+d*8)+' 126" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1.1"/>';[[x0+d*9,102],[x0-d*1,112],[x0+d*7,122]].forEach(function(q){tr+='<ellipse cx="'+q[0]+'" cy="'+q[1]+'" rx="6" ry="4.4" fill="'+lc+'" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1" transform="rotate('+(d*30)+' '+q[0]+' '+q[1]+')"/>'})});pot+=tr}
  return '<svg viewBox="-12 0 124 130" role="img" aria-label="'+esc(label(p))+'"><defs>'+defs+'</defs>'+stems+leaves+pot+'</svg>';
}
/* ---------- state + routing ---------- */
var st={path:[],mode:'groups',q:'',sort:'name',n:4};
function groupBy(list,fn){var m={},o=[];list.forEach(function(p){var k=fn(p);if(!m[k]){m[k]=[];o.push(k)}m[k].push(p)});return o.map(function(k){return{key:k,items:m[k]}})}
function sorted(gs){
  if(st.sort==='count')return gs.sort(function(a,b){return b.items.length-a.items.length||a.key.localeCompare(b.key)});
  return gs.sort(function(a,b){return a.key.localeCompare(b.key)});
}
function dnum(p){var m=(p.date||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?(+m[3])*10000+(+m[1])*100+(+m[2]):0}
function sortPlants(l){
  return l.slice().sort(function(a,b){return st.sort==='new'?dnum(b)-dnum(a):label(a).localeCompare(label(b))});
}
/* ---------- render shelves ---------- */
function cellHTML(c){if(c.decor)return '<div class="cell decor">'+c.decor+'</div>';return '<div class="cell"><button class="item" '+c.attr+' aria-label="'+esc(c.aria)+'">'+c.art+'</button></div>'}
function shelfHTML(plain){
  var cells=[],dn=0;
  plain.forEach(function(c,i){cells.push(c);if(plain.length>3&&i%5===3&&i<plain.length-1){cells.push({decor:DECOR[(dn++)%DECOR.length]})}});
  var n=st.n,html='';
  for(var i=0;i<cells.length;i+=n){
    var row=cells.slice(i,i+n),pad=n-row.length;
    html+='<div class="shelf" style="--n:'+n+'">'+row.map(cellHTML).join('');
    for(var k=0;k<pad;k++)html+='<div class="cell"></div>';
    html+='<div class="plank"><span class="br l"></span><span class="br r"></span></div>';
    row.forEach(function(c){if(c.decor){html+='<div class="tag"></div>';return}html+='<div class="tag"><span class="lab"><b>'+esc(c.title)+'</b><i>'+esc(c.sub||'')+'</i></span></div>'});
    for(var k2=0;k2<pad;k2++)html+='<div class="tag"></div>';
    html+='</div>';
  }
  return html;
}
function plantCell(p){
  var title=label(p).replace(/^(Al\.|Phil\.|Anth\.)\s*/,function(m){return {'Al.':'Alocasia ','Phil.':'Philodendron ','Anth.':'Anthurium '}[m.trim()]});
  return{key:p.tag,attr:'data-tag="'+esc(p.tag)+'"',aria:'Open '+label(p),bar:p.tag,art:plantSVG(p)+(p.photo?'<img class="pic" src="'+p.photo+'" alt="">':''),
    title:title,sub:[p.variant&&p.variant!=='Standard'?p.variant:'',p.seller].filter(Boolean).join(' · ')};
}
function groupCell(g,kind){
  var p=g.items[0],sp=kind==='cult'?(g.items[0].species||''):'';
  return{key:g.key,stack:g.items.length>1,attr:'data-go="'+esc(g.key)+'"',aria:'Open '+g.key+', '+g.items.length+' plants',bar:kind==='cult'?(p.genus||''):'genus',
    art:plantSVG(p)+(g.items.length>1?'<span class="count">×'+g.items.length+'</span>':''),title:g.key,sub:kind==='cult'?(sp||'species not set'):g.items.length+(g.items.length===1?' plant':' plants')};
}
function matches(p,q){
  q=q.toLowerCase();return [label(p),p.genus,p.species,p.cultivar,p.variant,p.seller,p.tag].join(' ').toLowerCase().indexOf(q)>-1;
}
function render(){
  var list=all(),cr=$('crumbs'),sh=$('shelves'),rank=$('rank'),cells=[],crumbs='';
  $('sub').textContent=list.length+' plants · '+groupBy(list,genKey).length+' genera';
  $('vGroups').setAttribute('aria-pressed',st.mode==='groups');$('vAll').setAttribute('aria-pressed',st.mode==='all');
  if(st.q.trim()){
    var r=sortPlants(list.filter(function(p){return matches(p,st.q)}));
    cr.innerHTML='';rank.textContent=r.length+' match'+(r.length===1?'':'es')+' for "'+st.q+'"';
    sh.innerHTML=r.length?shelfHTML(r.map(plantCell)):'<div class="empty">No plants match that search.</div>';return;
  }
  if(st.mode==='all'&&!st.path.length){
    cr.innerHTML='';rank.textContent='Every plant, '+list.length+' in total';
    sh.innerHTML=shelfHTML(sortPlants(list).map(plantCell));return;
  }
  crumbs='<button type="button" data-crumb="0" '+(st.path.length?'':'aria-current="page"')+'>All plants</button>';
  if(st.path[0])crumbs+='<span>›</span><button type="button" data-crumb="1" '+(st.path.length===1?'aria-current="page"':'')+'>'+esc(st.path[0])+'</button>';
  if(st.path[1])crumbs+='<span>›</span><button type="button" data-crumb="2" aria-current="page">'+esc(st.path[1])+'</button>';
  cr.innerHTML=crumbs;
  if(!st.path.length){
    var gs=sorted(groupBy(list,genKey));cells=gs.map(function(g){return groupCell(g,'genus')});
    rank.textContent='Pick a genus to open its shelf';
  }else if(st.path.length===1){
    var sub=list.filter(function(p){return genKey(p)===st.path[0]});
    var cg=sorted(groupBy(sub,cultKey));cells=cg.map(function(g){return groupCell(g,'cult')});
    rank.textContent=sub.length+' '+st.path[0]+' in '+cg.length+' kinds';
  }else{
    var pl=sortPlants(list.filter(function(p){return genKey(p)===st.path[0]&&cultKey(p)===st.path[1]}));
    cells=pl.map(plantCell);rank.textContent=pl.length+' x '+st.path[0]+' '+st.path[1];
  }
  sh.innerHTML=shelfHTML(cells);
}
/* ---------- detail sheet ---------- */
function find(tag){return all().filter(function(p){return p.tag===tag})[0]}
function cond(l,v,u){var has=v!==null&&v!==undefined&&v!=='';return'<div class="cond"><small>'+l+'</small><strong class="'+(has?'':'none')+'">'+(has?esc(v)+(u||''):'Not recorded yet')+'</strong></div>'}
function openPlant(tag,fromHash){
  var p=find(tag);if(!p){closeLayer();return}
  if(!fromHash)location.hash='p-'+tag;
  var url=location.href.split('#')[0]+'#p-'+tag;
  var art=p.photo?'<img src="'+p.photo+'" alt="Photo of '+esc(label(p))+'">'+'':plantSVG(p);
  $('layer').innerHTML='<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(label(p))+'"><button class="x" type="button" id="xBtn" aria-label="Close">✕</button>'+
   '<div class="hero"><div class="art2">'+art+(p.photo?'':'<span class="sh"></span>')+'</div><div><h2>'+esc(label(p))+'</h2><div class="chips">'+
   [p.genus,p.species,p.cultivar].filter(function(x,i,arr){return x&&arr.indexOf(x)===i}).map(function(c){return'<span class="chip">'+esc(c)+'</span>'}).join('')+
   (p.variant?'<span class="chip v">'+esc(p.variant)+'</span>':'')+'</div><p class="meta">Tag '+esc(p.tag)+(p.stage?' · '+esc(p.stage):'')+'</p></div></div>'+
   '<div class="grid">'+cond('Humidity',p.humidity,'%')+cond('Temperature',p.temp,'°F')+cond('Soil',p.soil)+cond('Light',p.light)+cond('Watering',p.water)+'</div>'+
   (p.notes?'<p class="meta">Notes: '+esc(p.notes)+'</p>':'')+
   '<p class="meta">'+[p.seller?'From '+esc(p.seller):'',p.date?'Bought '+esc(p.date):''].filter(Boolean).join(' · ')+'</p>'+
   '<div class="qr"><div class="box" id="qr"></div><div><p>Print this QR on the tag. Scanning it opens this page.</p><p id="qurl">'+esc(url)+'</p><button class="btn small" type="button" id="cpy">Copy link</button></div></div>'+
   '<div class="btns"><button class="btn primary" type="button" id="edit">Update conditions &amp; photo</button><button class="btn" type="button" id="jbtn">View JSON</button></div><div id="jwrap"></div></div></div>';
  try{if(window.QRCode)new QRCode($('qr'),{text:url,width:128,height:128,colorDark:'#1f2a22',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else $('qr').textContent='QR loading…'}catch(e){}
  wireLayer();
  $('cpy').onclick=function(){copy(url,'Link copied')};
  $('jbtn').onclick=function(){var w=$('jwrap');w.innerHTML=w.innerHTML?'':'<pre class="json">'+esc(JSON.stringify(plainOf(p),null,2))+'</pre>'};
  $('edit').onclick=function(){openForm(p)};
  $('xBtn').focus();
}
function plainOf(p){var o=Object.assign({},p);if(o.photo)o.photo='(image data)';return o}
function closeLayer(){$('layer').innerHTML='';if(location.hash)location.hash=''}
function wireLayer(){
  var v=$('veil');v.addEventListener('click',function(e){if(e.target===v)closeLayer()});
  var x=$('xBtn');if(x)x.onclick=closeLayer;
}
function copy(t,msg){
  function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Select and copy the text')}ta.remove()}
  try{navigator.clipboard.writeText(t).then(function(){toast(msg)},fb)}catch(e){fb()}
}
var tt;function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(function(){d.remove()},2200)}
/* ---------- JSON panel ---------- */
function openJson(){
  var txt=JSON.stringify(all().map(plainOf),null,2);
  $('layer').innerHTML='<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="Plant data"><button class="x" type="button" id="xBtn" aria-label="Close">✕</button><h2>Plant data (JSON)</h2><p class="meta">This is what a QR code would load from while the app is being built. '+all().length+' plants.</p><div class="btns"><button class="btn primary" type="button" id="cj">Copy all</button></div><pre class="json" style="max-height:50vh">'+esc(txt)+'</pre></div></div>';
  wireLayer();$('cj').onclick=function(){copy(txt,'JSON copied')};
}
/* ---------- add / edit form ---------- */
var KB=null;
function buildKB(){
  KB={};all().forEach(function(p){if(p.cultivar&&p.genus&&p.genus!=='None'){var k=p.cultivar.toLowerCase();if(!KB[k])KB[k]={genus:p.genus,species:p.species,cultivar:p.cultivar}}});
  [['black velvet','Alocasia','Reginula'],['ninja','Alocasia','Reginula'],['pink princess','Philodendron','Erubescens'],['frydek','Alocasia','Micholitziana'],['maculata','Begonia','Maculata'],['swiss cheese','Monstera','Adansonii'],['thai constellation','Monstera','Deliciosa'],['lemon lime','Philodendron','Hederaceum'],['neon','Pothos','Aureum']].forEach(function(r){if(!KB[r[0]])KB[r[0]]={genus:r[1],species:r[2],cultivar:r[0].replace(/\b\w/g,function(c){return c.toUpperCase()})}});
}
function detect(name){
  if(!KB)buildKB();
  var t=' '+name.toLowerCase()+' ',best=null,g=null;
  Object.keys(KB).forEach(function(k){if(t.indexOf(k)>-1&&(!best||k.length>best.length))best=k});
  GENERA.forEach(function(x){if(t.indexOf(' '+x.toLowerCase())>-1)g=x});
  if(/\bal\.? /.test(t))g=g||'Alocasia'; if(/\bphil\.? /.test(t))g=g||'Philodendron'; if(/\banth\.? /.test(t))g=g||'Anthurium';
  var r=best?Object.assign({},KB[best]):{};
  if(g&&!r.genus)r.genus=g;
  var v=null;[['albo','Albo'],['aurea','Aurea'],['pink','Pink'],['mint','Mint'],['gold','Gold'],['marble','Marble'],['variegat','Variegated']].forEach(function(a){if(!v&&t.indexOf(a[0])>-1)v=a[1]});
  if(v)r.variant=v;return r;
}
function opts(a,sel,blank){return(blank?'<option value="">'+blank+'</option>':'')+a.map(function(x){return'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
var photoData=null;
function openForm(p){
  var edit=!!p;p=p||{};photoData=null;
  var species=groupBy(all(),function(x){return x.species||''}).map(function(g){return g.key}).filter(Boolean).sort();
  var cults=groupBy(all(),cultKey).map(function(g){return g.key}).filter(function(k){return k!=='Unspecified'}).sort();
  var soilList=SOILS.slice();if(p.soil&&soilList.indexOf(p.soil)<0)soilList.unshift(p.soil);
  $('layer').innerHTML='<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+(edit?'Update plant':'Add a plant')+'"><button class="x" type="button" id="xBtn" aria-label="Close">✕</button>'+
  '<h2 style="margin-bottom:14px">'+(edit?'Update '+esc(label(p)):'Put a plant on the shelf')+'</h2><form id="f" novalidate>'+
  '<fieldset><legend>Photo</legend><div class="f"><label for="ph">Plant picture</label><input id="ph" type="file" accept="image/*"><span class="hint">Shown on the plant page. Without one, a drawn plant stands in.</span></div></fieldset>'+
  (edit?'':'<fieldset><legend>Which plant</legend><div class="f"><label for="nm">Plant name</label><input id="nm" autocomplete="off" placeholder="e.g. Al. Black Velvet Pink"></div><div id="rec"></div>'+
   '<div class="two"><div class="f"><label for="ge">Genus</label><select id="ge">'+opts(GENERA,'','Pick a genus')+'</select></div><div class="f"><label for="sp">Species</label><input id="sp" list="spl"></div>'+
   '<div class="f"><label for="cu">Cultivar / base form</label><input id="cu" list="cul"></div><div class="f"><label for="va">Variegation / mutation</label><select id="va">'+opts(VARS,'Standard')+'</select></div></div>'+
   '<datalist id="spl">'+species.map(function(s){return'<option value="'+esc(s)+'">'}).join('')+'</datalist><datalist id="cul">'+cults.map(function(s){return'<option value="'+esc(s)+'">'}).join('')+'</datalist>'+
   '<div class="f"><label for="ds">Description</label><textarea id="ds" rows="2" maxlength="200" placeholder="Where you got it, what you love about it"></textarea><span class="hint">200 characters max</span></div></fieldset>')+
  '<fieldset><legend>How you keep it</legend>'+
   '<div class="f"><label for="hu">Humidity: <output id="huo">'+(p.humidity||60)+'</output>%</label><input id="hu" type="range" min="20" max="100" step="5" value="'+(p.humidity||60)+'"></div>'+
   '<div class="two"><div class="f"><label for="te">Temperature (°F)</label><input id="te" type="number" min="40" max="100" value="'+esc(p.temp||'')+'" placeholder="72"></div>'+
   '<div class="f"><label for="li">Light</label><select id="li">'+opts(LIGHTS,p.light,'Not set')+'</select></div></div>'+
   '<div class="f"><label for="so">Soil</label><select id="so">'+opts(soilList,p.soil,'Not set')+'</select></div>'+
   '<div class="f"><label for="wa">Watering</label><select id="wa">'+opts(WATERS,p.water,'Not set')+'</select></div></fieldset>'+
  '<div class="btns"><button class="btn primary" type="submit">'+(edit?'Save changes':'Add to shelf')+'</button><button class="btn" type="button" id="cn">Cancel</button></div></form></div></div>';
  wireLayer();
  $('cn').onclick=function(){edit?openPlant(p.tag,true):closeLayer()};
  var dirty={};
  $('hu').oninput=function(){$('huo').textContent=this.value};
  $('ph').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.72);toast('Photo ready')};im.src=r.result};r.readAsDataURL(f)};
  if(!edit){
    ['ge','sp','cu','va'].forEach(function(i){$(i).addEventListener('change',function(){dirty[i]=1});$(i).addEventListener('input',function(){dirty[i]=1})});
    $('nm').oninput=function(){
      var d=detect(this.value),bits=[];
      if(d.genus&&!dirty.ge){$('ge').value=d.genus}
      if(d.species&&!dirty.sp)$('sp').value=d.species;
      if(d.cultivar&&!dirty.cu)$('cu').value=d.cultivar;
      if(d.variant&&!dirty.va)$('va').value=d.variant;
      if(d.genus)bits.push(d.genus);if(d.species)bits.push(d.species);if(d.cultivar)bits.push("'"+d.cultivar+"'");
      $('rec').innerHTML=bits.length?'<div class="found">Recognized: '+esc(bits.join(' '))+(d.variant?' · '+esc(d.variant):'')+'</div>':'';
    };
  }
  $('f').onsubmit=function(e){
    e.preventDefault();
    var c={humidity:+$('hu').value,temp:$('te').value?+$('te').value:null,light:$('li').value,soil:$('so').value,water:$('wa').value};
    if(photoData)c.photo=photoData;
    if(edit){store.edits[p.tag]=Object.assign(store.edits[p.tag]||{},c);save();render();openPlant(p.tag,true);toast('Saved');return}
    var nm=$('nm').value.trim(),ge=$('ge').value;
    if(!nm){$('nm').focus();toast('Give the plant a name');return}
    if(!ge){$('ge').focus();toast('Pick a genus');return}
    var code=(GCODE[ge]||ge.slice(0,2).toUpperCase()),ini=nm.replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(function(w){return w[0].toUpperCase()}).join('').slice(0,4),n=1,tag;
    var have={};all().forEach(function(x){have[x.tag]=1});do{tag=code+'-'+ini+'-ME-'+n++}while(have[tag]);
    var d=new Date(),dt=('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)+'/'+String(d.getFullYear()).slice(-2);
    store.added.push(Object.assign({tag:tag,genus:ge,species:$('sp').value.trim(),cultivar:$('cu').value.trim(),variant:$('va').value,name:nm,stage:'',seller:'Me',date:dt,notes:$('ds').value.trim()},c));
    save();KB=null;render();openPlant(tag);toast('Added to your shelf');
  };
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tag],[data-go],[data-crumb]');if(!t)return;
  if(t.dataset.tag){openPlant(t.dataset.tag);return}
  if(t.dataset.crumb){st.path=st.path.slice(0,+t.dataset.crumb);render();return}
  var k=t.dataset.go,list=all();
  if(!st.path.length){st.path=[k]}else{
    var items=list.filter(function(p){return genKey(p)===st.path[0]&&cultKey(p)===k});
    if(items.length===1){openPlant(items[0].tag);return}
    st.path=[st.path[0],k];
  }
  render();window.scrollTo(0,0);
});
$('bAdd').onclick=function(){openForm()};
$('bJson').onclick=openJson;
$('q').oninput=function(){st.q=this.value;render()};
$('sort').onchange=function(){st.sort=this.value;render()};
$('vGroups').onclick=function(){st.mode='groups';render()};
$('vAll').onclick=function(){st.mode='all';st.path=[];render()};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('layer').innerHTML)closeLayer()});
function route(){var m=location.hash.match(/^#p-([A-Z0-9-]+)$/);if(m){var p=find(m[1]);if(p)openPlant(m[1],true);else toast('No plant with tag '+m[1])}else if(!location.hash&&$('layer').querySelector('.hero'))$('layer').innerHTML=''}
window.addEventListener('hashchange',route);
function setN(){var w=document.querySelector('.wrap').clientWidth-20,n=Math.max(2,Math.min(6,Math.floor(w/108)));if(n!==st.n){st.n=n;render()}}
if(window.ResizeObserver)new ResizeObserver(setN).observe(document.querySelector('.wrap'));else window.addEventListener('resize',setN);
setN();render();route();
})();
</script>
